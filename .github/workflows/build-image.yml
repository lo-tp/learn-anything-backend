# Builds the API image and pushes it to Artifact Registry. The point of this file
# is the second half: the image is **built by a pipeline, not by a laptop**, so the
# thing that runs in the cluster is the thing a review saw.
#
# Authentication is the Workload Identity Federation set up in
# lo-tp/learn-anything-infra (`gcp/ci_identity.tf`): this job trades its GitHub
# OIDC token for an access token as `deploy-ci`, which needs no stored credential
# and no `gcloud`. The provider name encodes *this* repository, which is what
# makes the grant narrow.
#
# One human step, because it cannot be derived: the repository secret
# `PROMPTS_TOKEN` — a GitHub token with read access to lo-tp/learn-anything-prompts
# and nothing else. Without it this job stops at the submodule step and says so.

# Publish policy: `main` is verified, never published. `release` is the only branch
# that builds and pushes an image — promoting main into `release` (by merge, never
# by committing on it) is the human act that means "this goes live", and
# lo-tp/learn-anything-infra pins the digest that comes out of it.

name: build image

on:
  push:
    branches: [main, release]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # the OIDC token the workload identity provider trusts

env:
  PROJECT_ID: learn-anything-510905
  REGISTRY: asia-east2-docker.pkg.dev/learn-anything-510905/learn-anything
  IMAGE: learn-anything-backend
  # The provider's canonical resource name, which is `projects/<PROJECT_NUMBER>/…`,
  # not `projects/<PROJECT_ID>/…`. STS rejects the project-id audience with
  # `invalid_target` and a message claiming the provider may not exist, which is
  # how this line was wrong once. The authoritative copy is
  # `terraform output workload_identity_provider_names` in learn-anything-infra.
  WIF_PROVIDER: projects/358071090957/locations/global/workloadIdentityPools/learn-anything-github/providers/lo-tp-learn-anything-backend
  WIF_SERVICE_ACCOUNT: deploy-ci@learn-anything-510905.iam.gserviceaccount.com

jobs:
  # The three checks the repository's own Makefile runs — lint, typecheck, unit
  # tests — in CI, before anything is built. A green image is not a correct image.
  #
  # Dependencies are installed the way the Dockerfile installs them
  # (`uv sync --frozen` against uv.lock), with the dev group included, so the
  # resolved environment here and the one copied into the image come from the same
  # lock. The `prompts` submodule is deliberately absent: tests/conftest.py sets
  # LA_PROMPTS_STUB so a fresh clone without the private submodule still runs the
  # suite, which is exactly the condition this job should prove.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install the locked environment (plus dev tools)
        run: uv sync --frozen

      - name: Lint
        run: uv run ruff check .

      - name: Typecheck
        run: uv run pyright .

      - name: Unit tests
        run: uv run python -m pytest tests/ -q

  build:
    needs: check
    # Only `release` produces an image. Everything else is checked and stops there.
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `prompts/` is a private submodule, and the image expects it present (there
      # is a guard in the Dockerfile). It is initialised here, from the pinned
      # commit, so the commit being built is what decides which prompts ship.
      # The URL rewrite is spelled out rather than left to the checkout action,
      # because .gitmodules names an SSH URL and a token works over HTTPS.
      - name: Fetch the pinned prompts submodule
        env:
          PROMPTS_TOKEN: ${{ secrets.PROMPTS_TOKEN }}
        run: |
          if [ -z "$PROMPTS_TOKEN" ]; then
            echo "::error::Repository secret PROMPTS_TOKEN is not set (needs read access to lo-tp/learn-anything-prompts)."
            exit 1
          fi
          git -c "url.https://x-access-token:${PROMPTS_TOKEN}@github.com/.insteadOf=git@github.com:" \
            submodule update --init prompts
          test -f prompts/probe.py

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.WIF_SERVICE_ACCOUNT }}
          # Long enough to build and push, no longer.
          access_token_lifetime: 1800s

      - uses: docker/setup-buildx-action@v3

      # The registry password is an access token for the federated identity the
      # step above just obtained. `auth` exports a credentials file for gcloud
      # (CLOUDSDK_AUTH_CREDENTIAL_FILE_OVERRIDE) but its `access_token` output
      # arrived empty here, and login-action then fails with the useless message
      # "Password required". Minting it through gcloud is one more step and it is
      # visible: an empty token becomes a gcloud error that names the credential
      # it could not read.
      - id: ar_token
        name: Access token for Artifact Registry
        run: |
          token=$(gcloud auth print-access-token)
          [ -n "$token" ] || { echo "::error::no access token; the workload identity step did not leave a usable credential" >&2; exit 1; }
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: oauth2accesstoken
          password: ${{ steps.ar_token.outputs.token }}

      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          # The cluster schedules amd64. Building for the runner's native arch is
          # the same thing here, and stating it keeps an Apple-silicon laptop from
          # producing a local image the cluster would never run.
          platforms: linux/amd64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # The deploy pins a digest, not a tag: a tag can be re-pointed under a
      # rollout, a digest cannot. Surfaced here so promoting an image is a copy,
      # not a guess.
      - if: github.event_name == 'push'
        run: |
          {
            echo "## Image"
            echo "- tag: \`${{ env.REGISTRY }}/${{ env.IMAGE }}:sha-${{ github.sha }}\`"
            echo "- digest: \`${{ steps.build.outputs.digest }}\`"
            echo
            echo "Handed to learn-anything-infra: that repository pins this digest and deploys it."
          } >> "$GITHUB_STEP_SUMMARY"

      # The image exists and was built from `release`, so the deciding is done: hand
      # the delivery to the repository that owns deployment. It pins this digest and
      # runs the deploy order (secrets, migration gate, apply, rollout, drift check,
      # public surfaces). The dispatch is explicit because `workflow_run` cannot cross
      # repositories. It needs one repository secret: `DELIVERY_TOKEN`, a
      # fine-grained PAT allowed to start workflows in lo-tp/learn-anything-infra and
      # nothing else. If it is missing, warn rather than fail: the image is published,
      # and nothing then ships by itself: that repository's cron has never fired, so
      # the manual path is `gh workflow run deliver.yml --repo lo-tp/…-infra`.
      - name: Hand the delivery to the infrastructure repository
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.DELIVERY_TOKEN }}
        run: |
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::DELIVERY_TOKEN is not set in this repository, so nothing was dispatched. Deliver it by hand: gh workflow run deliver.yml --repo lo-tp/learn-anything-infra (that repository's schedule has never been observed to fire)."
            exit 0
          fi
          gh workflow run deliver.yml --repo lo-tp/learn-anything-infra --ref main \
            -f source_run="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
            -f source_repo="$GITHUB_REPOSITORY" \
            -f source_branch="$GITHUB_REF_NAME"
          echo "dispatched deliver.yml in lo-tp/learn-anything-infra from $GITHUB_REF_NAME"
