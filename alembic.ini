[alembic]
script_location = alembic
prepend_sys_path = .

# sqlalchemy.url is intentionally left blank.
# alembic/env.py reads DATABASE_URL from the environment instead.
sqlalchemy.url =

[loggers]
keys = root

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
