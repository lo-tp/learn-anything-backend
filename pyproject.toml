[project]
name = "learn-anything-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.141.1",
    "python-dotenv>=1.2.3",
    "uvicorn>=0.52.4",
    "langgraph>=0.4.0",
    "langchain-openai>=1.6.0",
    "sqlalchemy>=2.0",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "langid>=1.1.6",
]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's Depends()/Query() in argument defaults is the intended pattern.
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query"]

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

# Coverage is scoped to the two application layers under test. The gate
# fails the run unless overall coverage is at least 95%; every module in
# graphs/ and routers/ must stay above that line.
[tool.coverage.run]
source = ["graphs", "routers"]

[tool.coverage.report]
fail_under = 95
show_missing = true

[tool.pytest.ini_options]
addopts = "--cov=graphs --cov=routers --cov-report=term-missing --cov-fail-under=95"
